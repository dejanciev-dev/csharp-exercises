name: Build & Test

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - run: dotnet restore csharp-exercises.slnx
      - run: dotnet build csharp-exercises.slnx --no-restore
      - run: dotnet test csharp-exercises.slnx --no-build --verbosity normal
